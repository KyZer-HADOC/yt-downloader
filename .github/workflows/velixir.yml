name: Deploy to velixir

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to velixir
        env:
          VELIXIR_TOKEN: ${{ secrets.VELIXIR_API_KEY }}
        run: |
          echo "Velixir CLI deployment"
          curl -fsSL https://velixir.net/install.sh | sh
          velixir deploy --prod
