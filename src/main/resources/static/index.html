<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KyZer Video Downloader</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#0b1020,#24104f,#090d18)}.card{width:100%;max-width:680px;padding:30px;border:1px solid #ffffff18;border-radius:22px;background:#111827ee;box-shadow:0 20px 70px #0008}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#a5b4fc;margin:0 0 26px}label{display:block;margin:14px 0 7px;font-weight:700}input,select,button{width:100%;padding:14px;border-radius:11px;font-size:16px}input,select{border:1px solid #4b5563;background:#1f2937;color:#fff}button{margin-top:14px;border:0;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.info{display:none;margin-top:20px;padding:15px;border-radius:14px;background:#1f2937}.info img{width:100%;border-radius:10px}.info h3{margin-bottom:5px}.status{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center}.loading{display:block;background:#172554;color:#bfdbfe}.success{display:block;background:#052e16;color:#bbf7d0}.error{display:block;background:#450a0a;color:#fecaca}
</style></head>
<body><main class="card"><h1>🎬 KyZer Video Downloader</h1><p class="sub">Java 21 • Fast & Simple</p>
<label for="url">Video URL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
<label for="quality">Quality</label><select id="quality"><option value="best">Best Quality</option><option value="worst">Low Quality</option></select>
<button id="infoBtn">Get Video Info</button><button id="downloadBtn" style="display:none">⬇ Download MP4</button>
<section id="info" class="info"><img id="thumb"><h3 id="title"></h3><p id="duration"></p></section><div id="status" class="status"></div></main>
<script>
const $=id=>document.getElementById(id);function status(t,c){$('status').className='status '+c;$('status').textContent=t}
$('infoBtn').onclick=async()=>{let url=$('url').value.trim();if(!url)return status('Enter a video URL.','error');$('infoBtn').disabled=true;status('Getting video information...','loading');try{let r=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});let d=await r.json();if(!r.ok)throw Error(d.error||'Could not get info');$('thumb').src=d.thumbnail||'';$('title').textContent=d.title||'Video';$('duration').textContent='Duration: '+(d.duration||'unknown');$('info').style.display='block';$('downloadBtn').style.display='block';status('Video information loaded.','success')}catch(e){status('Error: '+e.message,'error')}finally{$('infoBtn').disabled=false}}
$('downloadBtn').onclick=async()=>{let url=$('url').value.trim(),quality=$('quality').value;if(!url)return status('Enter a video URL.','error');$('downloadBtn').disabled=true;status('Downloading... Please wait.','loading');try{let r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,quality})});if(!r.ok){let d=await r.json();throw Error(d.error||'Download failed')}let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='kyzer-video.mp4';a.click();URL.revokeObjectURL(u);status('✅ Download completed.','success')}catch(e){status('Error: '+e.message,'error')}finally{$('downloadBtn').disabled=false}}
</script></body></html>
