<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KyZer YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 20px;
            font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #111827, #312e81, #111827); color: #fff;
        }
        .container {
            width: 100%; max-width: 650px; padding: 32px; border-radius: 22px;
            background: rgba(17, 24, 39, .94); box-shadow: 0 25px 70px rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.1);
        }
        h1 { text-align: center; margin: 0 0 8px; }
        .sub { text-align: center; color: #a5b4fc; margin: 0 0 28px; }
        label { display: block; margin: 15px 0 8px; font-weight: 700; }
        input, select, button { width: 100%; padding: 14px; border-radius: 11px; font-size: 16px; }
        input, select { border: 1px solid #4b5563; background: #1f2937; color: #fff; }
        button { margin-top: 16px; border: 0; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        #videoInfo { display: none; margin-top: 22px; padding: 16px; border-radius: 14px; background: #1f2937; }
        #thumbnail { width: 100%; border-radius: 10px; display: block; margin-bottom: 14px; }
        #videoTitle { margin: 0 0 8px; }
        #videoDuration { color: #cbd5e1; margin: 0; }
        #status { display: none; margin-top: 16px; padding: 13px; border-radius: 10px; text-align: center; }
        .loading { display: block !important; background: #172554; color: #bfdbfe; }
        .success { display: block !important; background: #052e16; color: #bbf7d0; }
        .error { display: block !important; background: #450a0a; color: #fecaca; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; vertical-align: -3px; margin-right: 7px; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 KyZer YouTube Downloader</h1>
    <p class="sub">Download YouTube videos directly</p>

    <label for="url">YouTube URL</label>
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

    <label for="quality">Quality</label>
    <select id="quality">
        <option value="best">Best Quality</option>
        <option value="worst">Low Quality (Fast)</option>
    </select>

    <button id="infoBtn" onclick="fetchInfo()">Get Video Info</button>
    <button id="downloadBtn" onclick="downloadVideo()" style="display:none">⬇ Download</button>

    <div id="videoInfo">
        <img id="thumbnail" alt="Video thumbnail">
        <h3 id="videoTitle"></h3>
        <p id="videoDuration"></p>
    </div>
    <div id="status"></div>
</div>

<script>
function showStatus(message, type) {
    const el = document.getElementById('status');
    el.className = type;
    el.innerHTML = type === 'loading' ? '<span class="spinner"></span>' + message : message;
}

function formatDuration(seconds) {
    seconds = Number(seconds || 0);
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

async function fetchInfo() {
    const url = document.getElementById('url').value.trim();
    if (!url) return showStatus('Please enter a YouTube URL.', 'error');

    const btn = document.getElementById('infoBtn');
    btn.disabled = true;
    showStatus('Getting video information...', 'loading');

    try {
        const response = await fetch('/get-info', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || 'Could not get video information.');

        document.getElementById('thumbnail').src = data.thumbnail || '';
        document.getElementById('videoTitle').textContent = data.title || 'YouTube video';
        document.getElementById('videoDuration').textContent = 'Duration: ' + formatDuration(data.duration);
        document.getElementById('videoInfo').style.display = 'block';

        const select = document.getElementById('quality');
        select.innerHTML = '<option value="best">Best Quality</option><option value="worst">Low Quality (Fast)</option>';
        (data.formats || []).forEach(f => {
            const option = document.createElement('option');
            option.value = f.format_id;
            option.textContent = f.quality;
            select.appendChild(option);
        });
        document.getElementById('downloadBtn').style.display = 'block';
        showStatus('Video information loaded.', 'success');
    } catch (e) {
        showStatus('Error: ' + e.message, 'error');
    } finally { btn.disabled = false; }
}

async function downloadVideo() {
    const url = document.getElementById('url').value.trim();
    const quality = document.getElementById('quality').value;
    if (!url) return showStatus('Please enter a YouTube URL.', 'error');

    const btn = document.getElementById('downloadBtn');
    btn.disabled = true;
    showStatus('Downloading... Please wait.', 'loading');

    try {
        const response = await fetch('/download', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url, quality})
        });
        if (!response.ok) {
            let message = 'Download failed.';
            try { message = (await response.json()).error || message; } catch (_) {}
            throw new Error(message);
        }

        const blob = await response.blob();
        const disposition = response.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^";]+)"?/i);
        const filename = match ? match[1] : 'youtube-video.mp4';
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        showStatus('✅ Download completed.', 'success');
    } catch (e) {
        showStatus('Error: ' + e.message, 'error');
    } finally { btn.disabled = false; }
}

document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') fetchInfo(); });
</script>
</body>
</html>
